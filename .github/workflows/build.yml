name: Build

# Runs only when a release tag is pushed (e.g. `git tag v1.0.0 && git push origin v1.0.0`):
# builds and tests the .deb and the Fedora .rpm, then publishes both as a
# GitHub Release.
on:
  push:
    tags: ['v*']

jobs:
  deb:
    # Oldest supported base (Qt 6.2, glibc 2.35) so the .deb installs on
    # Ubuntu 22.04+, Debian 12+, Linux Mint 21+ and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ dpkg-dev file \
            qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins libqt6svg6-dev \
            libgl1-mesa-dev libxkbcommon-dev \
            dbus dconf-cli libglib2.0-bin   # sandboxed hotkey-script tests

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Build .deb
        run: |
          cd build
          cpack -G DEB
          dpkg-deb --info ./*.deb
          dpkg-deb --contents ./*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/*.deb
          if-no-files-found: error

  rpm:
    # Oldest supported Fedora, so the RPM also installs on newer releases.
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Tools for checkout
        run: dnf -y install git tar gzip findutils

      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          dnf -y install rpm-build "dnf-command(builddep)"
          dnf -y builddep packaging/rpm/snip-and-sketch.spec

      - name: Build RPM (runs the Qt test suites in %check)
        run: packaging/rpm/build-rpm.sh --out dist

      - name: Install test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dnf -y install ./dist/snip-and-sketch-[0-9]*.x86_64.rpm
          snip --version
          snip-hotkey --help > /dev/null
          test -x /usr/libexec/snip-and-sketch/session-hotkey
          test -f /etc/xdg/autostart/snip-and-sketch-hotkey.desktop
          rpm -e snip-and-sketch
          test ! -e /usr/bin/snip   # not `command -v`: bash remembers the old path

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/snip-and-sketch-[0-9]*.x86_64.rpm
          if-no-files-found: error

  release:
    needs: [deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4   # the deb and rpm artifacts into one folder
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm
          generate_release_notes: true
